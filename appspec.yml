version: 0.0
os: linux

files:
  - source: /
    destination: /home/ec2-user/project-pie
    overwrite: yes
    file_exists_behavior: OVERWRITE

permissions:
  - object: /home/ec2-user/project-pie
    owner: ec2-user
    group: ec2-user
    mode: 755
    type:
      - directory
  - object: /home/ec2-user/project-pie/scripts
    owner: ec2-user
    group: ec2-user
    mode: 755
    type:
      - directory
  - object: /home/ec2-user/project-pie/scripts/codedeploy
    pattern: "**"
    owner: ec2-user
    group: ec2-user
    mode: 755

hooks:
  BeforeInstall:
    - location: scripts/codedeploy/stop-application.sh
      timeout: 300
      runas: ec2-user
  ApplicationStop:
    - location: scripts/codedeploy/stop-application.sh
      timeout: 300
      runas: ec2-user
  AfterInstall:
    - location: scripts/codedeploy/install-dependencies.sh
      timeout: 600
      runas: ec2-user
  ApplicationStart:
    - location: scripts/codedeploy/start-application.sh
      timeout: 300
      runas: ec2-user
  ValidateService:
    - location: scripts/codedeploy/validate-service.sh
      timeout: 300
      runas: ec2-user 