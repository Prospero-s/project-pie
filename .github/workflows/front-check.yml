name: Front-end Checks

on:
  push:
    branches: [ prod, dev, rebase-dev ]
  pull_request:
    branches: [ prod, dev, rebase-dev ]

jobs:
  code-quality:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
        
    - name: Install dependencies
      run: npm install
      
    - name: Run ESLint Fix
      run: npm run lint-fix || true
      
    - name: Run ESLint Check
      run: npm run lint