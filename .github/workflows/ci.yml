name: CI Pipeline

on:
  push:
    branches: [main, dev, rebase-dev, prod]
  pull_request:
    branches: [main, dev, rebase-dev, prod]
  workflow_dispatch:

jobs:
  docker-lint:
    name: 🐳 Docker Lint
    runs-on: ubuntu-latest
    steps:
      -
        name: Checkout
        uses: actions/checkout@v4
      -
        name: Lint Dockerfile
        uses: hadolint/hadolint-action@v3.1.0

  setup-backend:
    name: 📥 Install Backend Dependencies
    runs-on: ubuntu-latest
    needs: [docker-lint]
    env:
      APP_ENV: test
      APP_DEBUG: 1

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          tools: composer:v2
          coverage: xdebug
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv, xdebug
          ini-values: xdebug.mode=coverage

      - name: Cache Composer Packages
        id: composer-cache
        uses: actions/cache@v3
        with:
          path: vendor
          key: ${{ runner.os }}-php-${{ hashFiles('composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-

      - name: Copy .env.example
        run: cp .env.example .env

      - name: Install Backend Dependencies
        run: composer install --prefer-dist --no-progress --no-interaction --optimize-autoloader

  setup-frontend:
    name: 📥 Install Frontend Dependencies
    runs-on: ubuntu-latest
    needs: [docker-lint]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "18"
          cache: "npm"
          cache-dependency-path: ./

      - name: Install Frontend Dependencies
        run: npm install --no-cache

  backend-code-quality:
    name: 🎨 Backend Code Quality
    runs-on: ubuntu-latest
    needs: setup-backend
    env:
      APP_ENV: test
      APP_DEBUG: 1

    steps:
    - uses: actions/checkout@v4
    
    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.3'
        tools: composer:v2
        coverage: none
    
    - name: Cache Composer packages
      id: composer-cache
      uses: actions/cache@v3
      with:
        path: vendor
        key: ${{ runner.os }}-php-${{ hashFiles('composer.lock') }}
        restore-keys: |
          ${{ runner.os }}-php-

    - name: Copy .env.example
      run: cp .env.example .env
    
    - name: Install dependencies
      run: composer install --prefer-dist --no-progress
    
    - name: Fix PHP Code Style
      run: vendor/bin/phpcbf --standard=PSR12 src/ || true
    
    - name: Run PHP_CodeSniffer
      run: vendor/bin/phpcs --standard=PSR12 src/
    
    - name: Run PHPStan
      run: vendor/bin/phpstan analyse -c phpstan.dist.neon --no-progress

  backend-tests:
    name: 🧪 Backend Tests
    runs-on: ubuntu-latest
    needs: [setup-backend, backend-code-quality]  # Ajout de la dépendance à backend-code-quality
    env:
      APP_ENV: test
      APP_DEBUG: 1
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/test_db?serverVersion=15&charset=utf8"

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4
    
    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.3'
        tools: composer:v2
        coverage: xdebug
    
    - name: Cache Composer packages
      id: composer-cache
      uses: actions/cache@v3
      with:
        path: vendor
        key: ${{ runner.os }}-php-${{ hashFiles('composer.lock') }}
        restore-keys: |
          ${{ runner.os }}-php-

    - name: Copy .env.example
      run: cp .env.example .env
    
    - name: Install dependencies
      run: composer install --prefer-dist --no-progress

    - name: Create test database
      run: |
        php bin/console doctrine:database:create --env=test
        php bin/console doctrine:schema:create --env=test

    - name: Run Unit Tests
      run: vendor/bin/phpunit --testsuite Unit --coverage-text --coverage-clover=coverage.xml

    - name: Run Integration Tests
      run: vendor/bin/phpunit --testsuite Integration --coverage-text --coverage-clover=coverage.xml

    - name: Run Functional Tests
      run: vendor/bin/phpunit --testsuite Functional --coverage-text --coverage-clover=coverage.xml

    - name: Cleanup test database
      if: always()
      run: php bin/console doctrine:database:drop --force --env=test

  frontend-code-quality:
    name: 🎨 Frontend Code Quality
    runs-on: ubuntu-latest
    needs: setup-frontend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "18"
          cache: "npm"
          cache-dependency-path: ./

      - name: Install Frontend Dependencies
        run: npm install

      - name: Check if node_modules is present
        run: |
          echo "Listing node_modules directory"
          ls -l  ./node_modules || echo "node_modules not found"
        
      - name: Run ESLint Fix
        run: npm run lint-fix || true
        
      - name: Run ESLint Check
        run: npm run lint

  frontend-build:
    name: 🏗️ Build Frontend
    runs-on: ubuntu-latest
    needs: [frontend-code-quality, backend-tests]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "18"
          cache: "npm"
          cache-dependency-path: ./

      - name: Install Frontend Dependencies
        run: npm install

      - name: Build Frontend
        run: npm run build

  deploy-production:
    name: 🚀 Deploy to Production
    runs-on: ubuntu-latest
    needs: [frontend-build]
    # Se déclenche quand une PR est mergée vers rebase-dev
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/rebase-dev') ||
      (github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'rebase-dev')
    
    steps:
    - name: 🔑 Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: eu-west-3

    - name: 🔄 Execute deployment script on EC2
      run: |
        echo "🚀 Exécution du déploiement automatique sur l'instance EC2..."
        echo "📋 Event: ${{ github.event_name }}"
        echo "📋 Ref: ${{ github.ref }}"
        echo "📋 Branch: ${{ github.ref_name }}"
        
        # Exécuter le script de déploiement (gère la création des logs automatiquement)
        COMMAND_ID=$(aws ssm send-command \
          --document-name "AWS-RunShellScript" \
          --parameters 'commands=["bash /home/ec2-user/update-prod.sh"]' \
          --targets "Key=instanceids,Values=i-09c6302b593fcda25" \
          --comment "Automatic deployment from GitHub Actions" \
          --query 'Command.CommandId' \
          --output text)
        
        echo "📋 Command ID: $COMMAND_ID"
        
        # Attendre que la commande se termine
        aws ssm wait command-executed \
          --command-id $COMMAND_ID \
          --instance-id i-09c6302b593fcda25 \
          --cli-read-timeout 600
        
        echo "📊 Résultat du déploiement:"
        aws ssm get-command-invocation \
          --command-id $COMMAND_ID \
          --instance-id i-09c6302b593fcda25 \
          --query 'StandardOutputContent' \
          --output text
        
        # Vérifier le statut de sortie
        EXIT_CODE=$(aws ssm get-command-invocation \
          --command-id $COMMAND_ID \
          --instance-id i-09c6302b593fcda25 \
          --query 'ResponseCode' \
          --output text)
        
        if [ "$EXIT_CODE" -eq 0 ]; then
          echo "✅ Déploiement automatique réussi!"
        else
          echo "❌ Échec du déploiement automatique (exit code: $EXIT_CODE)"
          exit 1
        fi

    - name: 📋 Check deployment logs
      run: |
        echo "📋 Vérification des logs de déploiement..."
        
        # Utiliser le script de monitoring sur EC2
        COMMAND_ID=$(aws ssm send-command \
          --document-name "AWS-RunShellScript" \
          --parameters 'commands=["bash /home/ec2-user/monitor-deployment.sh"]' \
          --targets "Key=instanceids,Values=i-09c6302b593fcda25" \
          --comment "Monitor deployment logs" \
          --query 'Command.CommandId' \
          --output text)
        
        aws ssm wait command-executed \
          --command-id $COMMAND_ID \
          --instance-id i-09c6302b593fcda25 \
          --cli-read-timeout 120
        
        echo "📊 Monitoring des logs de déploiement:"
        aws ssm get-command-invocation \
          --command-id $COMMAND_ID \
          --instance-id i-09c6302b593fcda25 \
          --query 'StandardOutputContent' \
          --output text
        
        echo "✅ Monitoring terminé!"