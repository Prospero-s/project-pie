name: CI Pipeline

on:
  push:
    branches: [main, dev, rebase-dev, prod]
  pull_request:
    branches: [main, dev, rebase-dev, prod]
  workflow_dispatch:

jobs:
  docker-lint:
    name: 🐳 Docker Lint
    runs-on: ubuntu-latest
    steps:
      -
        name: Checkout
        uses: actions/checkout@v4
      -
        name: Lint Dockerfile
        uses: hadolint/hadolint-action@v3.1.0

  setup-backend:
    name: 📥 Install Backend Dependencies
    runs-on: ubuntu-latest
    needs: [docker-lint]
    env:
      APP_ENV: test
      APP_DEBUG: 1

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          tools: composer:v2
          coverage: xdebug
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv, xdebug
          ini-values: xdebug.mode=coverage

      - name: Cache Composer Packages
        id: composer-cache
        uses: actions/cache@v3
        with:
          path: vendor
          key: ${{ runner.os }}-php-${{ hashFiles('composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-

      - name: Copy .env.example
        run: cp .env.example .env

      - name: Install Backend Dependencies
        run: composer install --prefer-dist --no-progress --no-interaction --optimize-autoloader

  setup-frontend:
    name: 📥 Install Frontend Dependencies
    runs-on: ubuntu-latest
    needs: [docker-lint]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "18"
          cache: "npm"
          cache-dependency-path: ./

      - name: Install Frontend Dependencies
        run: npm install --no-cache

  backend-code-quality:
    name: 🎨 Backend Code Quality
    runs-on: ubuntu-latest
    needs: setup-backend
    env:
      APP_ENV: test
      APP_DEBUG: 1

    steps:
    - uses: actions/checkout@v4
    
    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.3'
        tools: composer:v2
        coverage: none
    
    - name: Cache Composer packages
      id: composer-cache
      uses: actions/cache@v3
      with:
        path: vendor
        key: ${{ runner.os }}-php-${{ hashFiles('composer.lock') }}
        restore-keys: |
          ${{ runner.os }}-php-

    - name: Copy .env.example
      run: cp .env.example .env
    
    - name: Install dependencies
      run: composer install --prefer-dist --no-progress
    
    - name: Fix PHP Code Style
      run: vendor/bin/phpcbf --standard=PSR12 src/ || true
    
    - name: Run PHP_CodeSniffer
      run: vendor/bin/phpcs --standard=PSR12 src/
    
    - name: Run PHPStan
      run: vendor/bin/phpstan analyse -c phpstan.dist.neon --no-progress

  backend-tests:
    name: 🧪 Backend Tests
    runs-on: ubuntu-latest
    needs: [setup-backend, backend-code-quality]  # Ajout de la dépendance à backend-code-quality
    env:
      APP_ENV: test
      APP_DEBUG: 1
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/test_db?serverVersion=15&charset=utf8"

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4
    
    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.3'
        tools: composer:v2
        coverage: xdebug
    
    - name: Cache Composer packages
      id: composer-cache
      uses: actions/cache@v3
      with:
        path: vendor
        key: ${{ runner.os }}-php-${{ hashFiles('composer.lock') }}
        restore-keys: |
          ${{ runner.os }}-php-

    - name: Copy .env.example
      run: cp .env.example .env
    
    - name: Install dependencies
      run: composer install --prefer-dist --no-progress

    - name: Create test database
      run: |
        php bin/console doctrine:database:create --env=test
        php bin/console doctrine:schema:create --env=test

    - name: Run Unit Tests
      run: vendor/bin/phpunit --testsuite Unit --coverage-text --coverage-clover=coverage.xml

    - name: Run Integration Tests
      run: vendor/bin/phpunit --testsuite Integration --coverage-text --coverage-clover=coverage.xml

    - name: Run Functional Tests
      run: vendor/bin/phpunit --testsuite Functional --coverage-text --coverage-clover=coverage.xml

    - name: Cleanup test database
      if: always()
      run: php bin/console doctrine:database:drop --force --env=test

  frontend-code-quality:
    name: 🎨 Frontend Code Quality
    runs-on: ubuntu-latest
    needs: setup-frontend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "18"
          cache: "npm"
          cache-dependency-path: ./

      - name: Install Frontend Dependencies
        run: npm install

      - name: Check if node_modules is present
        run: |
          echo "Listing node_modules directory"
          ls -l  ./node_modules || echo "node_modules not found"
        
      - name: Run ESLint Fix
        run: npm run lint-fix || true
        
      - name: Run ESLint Check
        run: npm run lint

  frontend-build:
    name: 🏗️ Build Frontend
    runs-on: ubuntu-latest
    needs: [frontend-code-quality, backend-tests]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "18"
          cache: "npm"
          cache-dependency-path: ./

      - name: Install Frontend Dependencies
        run: npm install

      - name: Build Frontend
        run: npm run build

  deploy-production:
    name: 🚀 Deploy with CodeDeploy
    runs-on: ubuntu-latest
    needs: [frontend-build]
    # Se déclenche quand une PR est mergée vers rebase-dev
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/rebase-dev') ||
      (github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'rebase-dev')
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: 🔑 Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: eu-west-3

    - name: 📦 Create deployment package
      run: |
        echo "📋 Création du package de déploiement..."
        
        # Créer le package avec les fichiers nécessaires
        # Utiliser --warning=no-file-changed pour éviter les erreurs sur les fichiers temporaires
        tar --warning=no-file-changed -czf deployment-package.tar.gz \
          --exclude='node_modules' \
          --exclude='.git' \
          --exclude='vendor' \
          --exclude='var' \
          --exclude='*.log' \
          --exclude='.env' \
          --exclude='deployment-package.tar.gz' \
          --exclude='.github' \
          --exclude='tests' \
          --exclude='*.md' \
          --exclude='.gitignore' \
          --exclude='tmp' \
          --exclude='temp' \
          --exclude='storage/logs' \
          --exclude='storage/cache' \
          --exclude='public/uploads' \
          --exclude='*.tmp' \
          --exclude='*.swp' \
          --exclude='*.swo' \
          --exclude='*~' \
          .
        
        echo "📦 Package créé: $(ls -lh deployment-package.tar.gz)"
        
        # Vérifier le contenu du package
        echo "📋 Contenu du package:"
        tar -tzf deployment-package.tar.gz | head -20

    - name: 📤 Upload to S3
      run: |
        # Créer un nom unique pour le déploiement
        DEPLOYMENT_ID="project-pie-$(date +%Y%m%d-%H%M%S)-${GITHUB_SHA:0:8}"
        
        echo "📤 Upload vers S3..."
        aws s3 cp deployment-package.tar.gz s3://project-pie-deployments/${DEPLOYMENT_ID}.tar.gz
        
        # Vérifier l'upload
        if aws s3 ls s3://project-pie-deployments/${DEPLOYMENT_ID}.tar.gz; then
          echo "✅ Upload réussi"
        else
          echo "❌ Échec de l'upload"
          exit 1
        fi
        
        # Sauvegarder l'ID pour l'étape suivante
        echo "DEPLOYMENT_ID=${DEPLOYMENT_ID}" >> $GITHUB_ENV
        echo "📋 Deployment ID: ${DEPLOYMENT_ID}"

    - name: 🚀 Deploy with CodeDeploy
      run: |
        echo "🚀 Déploiement via CodeDeploy..."
        
        # Vérifier que l'application et le groupe de déploiement existent
        if ! aws deploy get-application --application-name project-pie; then
          echo "❌ L'application CodeDeploy 'project-pie' n'existe pas"
          exit 1
        fi
        
        if ! aws deploy get-deployment-group --application-name project-pie --deployment-group-name project-pie-production; then
          echo "❌ Le groupe de déploiement 'project-pie-production' n'existe pas"
          exit 1
        fi
        
        # Créer le déploiement
        DEPLOYMENT_ID_AWS=$(aws deploy create-deployment \
          --application-name project-pie \
          --deployment-group-name project-pie-production \
          --s3-location bucket=project-pie-deployments,key=${DEPLOYMENT_ID}.tar.gz,bundleType=tgz \
          --file-exists-behavior OVERWRITE \
          --description "Deployment from GitHub Actions - ${GITHUB_SHA:0:8}" \
          --query 'deploymentId' \
          --output text)
        
        echo "📋 AWS Deployment ID: ${DEPLOYMENT_ID_AWS}"
        
        # Attendre la fin du déploiement avec timeout
        echo "⏳ Attente de la fin du déploiement..."
        if aws deploy wait deployment-successful --deployment-id ${DEPLOYMENT_ID_AWS}; then
          echo "✅ Déploiement terminé avec succès!"
        else
          echo "❌ Échec du déploiement"
          
          # Afficher les détails de l'échec
          echo "📋 Détails du déploiement:"
          aws deploy get-deployment --deployment-id ${DEPLOYMENT_ID_AWS} --query 'deploymentInfo.errorInformation' --output text
          
          exit 1
        fi
        
        # Afficher le résultat final
        echo "📊 Statut final du déploiement:"
        aws deploy get-deployment --deployment-id ${DEPLOYMENT_ID_AWS} --query 'deploymentInfo.status' --output text

    - name: 📋 Deployment Summary
      run: |
        echo "## 🎉 Déploiement Réussi" >> $GITHUB_STEP_SUMMARY
        echo "- **Commit:** ${GITHUB_SHA:0:8}" >> $GITHUB_STEP_SUMMARY
        echo "- **Branche:** ${GITHUB_REF_NAME}" >> $GITHUB_STEP_SUMMARY
        echo "- **Deployment ID:** ${DEPLOYMENT_ID}" >> $GITHUB_STEP_SUMMARY
        echo "- **Région AWS:** eu-west-3" >> $GITHUB_STEP_SUMMARY
        echo "- **Application:** project-pie" >> $GITHUB_STEP_SUMMARY
        echo "- **Groupe de déploiement:** project-pie-production" >> $GITHUB_STEP_SUMMARY