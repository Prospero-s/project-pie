name: CI Pipeline

on:
  push:
    branches: [main, dev, rebase-dev]
  pull_request:
    branches: [main, dev, rebase-dev]

jobs:
  docker-lint:
    name: 🐳 Docker Lint
    runs-on: ubuntu-latest
    steps:
      -
        name: Checkout
        uses: actions/checkout@v4
      -
        name: Lint Dockerfile
        uses: hadolint/hadolint-action@v3.1.0

  setup-backend:
    name: 📥 Install Backend Dependencies
    runs-on: ubuntu-latest
    needs: [docker-lint]
    env:
      APP_ENV: test
      APP_DEBUG: 1

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          tools: composer:v2
          coverage: none

      - name: Cache Composer Packages
        id: composer-cache
        uses: actions/cache@v3
        with:
          path: vendor
          key: ${{ runner.os }}-php-${{ hashFiles('composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-

      - name: Copy .env.example
        run: cp .env.example .env

      - name: Install Backend Dependencies
        run: composer install --no-cache --prefer-dist --no-progress --no-interaction

  setup-frontend:
    name: 📥 Install Frontend Dependencies
    runs-on: ubuntu-latest
    needs: [docker-lint]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "18"
          cache: "npm"
          cache-dependency-path: ./

      - name: Install Frontend Dependencies
        run: npm install --no-cache

      - name: Restore Node Modules Cache
        uses: actions/cache@v3
        with:
          path: ./node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

  backend-code-quality:
    name: 🎨 Backend Code Quality
    runs-on: ubuntu-latest
    needs: setup-backend
    env:
      APP_ENV: test
      APP_DEBUG: 1

    steps:
    - uses: actions/checkout@v4
    
    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'
        tools: composer:v2
        coverage: none
    
    - name: Cache Composer packages
      id: composer-cache
      uses: actions/cache@v3
      with:
        path: vendor
        key: ${{ runner.os }}-php-${{ hashFiles('composer.lock') }}
        restore-keys: |
          ${{ runner.os }}-php-

    - name: Copy .env.example
      run: cp .env.example .env
    
    - name: Install dependencies
      run: composer install --prefer-dist --no-progress
    
    - name: Fix PHP Code Style
      run: vendor/bin/phpcbf --standard=PSR12 src/ || true
    
    - name: Run PHP_CodeSniffer
      run: vendor/bin/phpcs --standard=PSR12 src/
    
    - name: Run PHPStan
      run: vendor/bin/phpstan analyse -c phpstan.dist.neon --no-progress

  frontend-code-quality:
    name: 🎨 Frontend Code Quality
    runs-on: ubuntu-latest
    needs: setup-frontend

    steps:
    - uses: actions/checkout@v4

    - name: Restore Node Modules Cache
      uses: actions/cache@v3
      with:
        path:  ./node_modules
        key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
        restore-keys: |
          ${{ runner.os }}-node-

    - name: Check if node_modules is restored
      run: |
        echo "Listing node_modules directory"
        ls -l  ./node_modules || echo "node_modules not found"
      
    - name: Run ESLint Fix
      run: npm run lint-fix || true
      
    - name: Run ESLint Check
      run: npm run lint

  frontend-build:
    name: 🏗️ Build Frontend
    runs-on: ubuntu-latest
    needs: [frontend-code-quality, backend-code-quality]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Restore Node Modules Cache
        uses: actions/cache@v3
        with:
          path:  ./node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Build Frontend
        run: npm run build
